name: nyc_analytics
version: 1.0.0
config-version: 2
profile: default
model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots
target-path: target
clean-targets:
  - target
  - dbt_packages
models:
  nyc_analytics:
    +materialized: table
    assignment_work:
      staging:
        +materialized: table
        +schema: nyc_homework_staging
      marts:
        +materialized: table
        +schema: nyc_homework_warehouse_marts
        conformed:
          +materialized: table
        dob_job_filings:
          +materialized: table
        dot_311:
          +materialized: table

    group_11_project:
      staging:
        +materialized: table
        +schema: group_project_staging

      marts:
        +materialized: table
        +schema: group_project_marts
      
        conformed:
          +materialized: table

        inspections:
          +materialized: table

        311_service_requests:
          +materialized: table